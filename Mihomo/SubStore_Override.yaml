      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇹🇼 台湾节点"
      - "🌐 其他地区"
      - "♻️ 自动选择"
    include-all-proxies: true
    exclude-type: direct

