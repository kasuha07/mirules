# ============================================================
# Sub-Store Mihomo YAML Override
# Converted from: Mihomo/Custom_Clash.ini
#
# Usage in Sub-Store:
# 1. 文件 -> 新建 -> 类型选择「mihomo 配置」
# 2. 来源选择「单条订阅」或「组合订阅」
# 3. 在「操作」中添加「脚本操作」
# 4. 使用本文件的 Raw URL 作为 YAML 覆写
#
# This file intentionally does not define "proxies".
# Sub-Store generates proxies dynamically from the selected subscription.
# ============================================================

rule-providers:
  custom_direct_domain:
    type: http
    behavior: domain
    format: yaml
    url: "https://testingcf.jsdelivr.net/gh/kasuha07/mirules@main/Mihomo/Provider/Custom_Direct_Domain.yaml"
    interval: 28800

  custom_proxy_classical:
    type: http
    behavior: classical
    format: yaml
    url: "https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Proxy_Classical.yaml"
    interval: 28800

  steam_cdn:
    type: http
    behavior: classical
    format: yaml
    url: "https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Steam_CDN_Classical.yaml"
    interval: 2880

  custom_large_download_domain:
    type: http
    behavior: domain
    format: yaml
    url: "https://testingcf.jsdelivr.net/gh/kasuha07/mirules@main/Mihomo/Provider/Custom_Large_Download_Domain.yaml"
    interval: 28800

  ai_global:
    type: http
    behavior: classical
    format: yaml
    url: "https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/global.yaml"
    interval: 28800

  custom_port_direct:
    type: http
    behavior: classical
    format: yaml
    url: "https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Port_Direct.yaml"
    interval: 28800

proxy-groups:
  - name: "🚀 手动选择"
    type: select
