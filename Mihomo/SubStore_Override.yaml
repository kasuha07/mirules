    interval: 600
    timeout: 5000
    tolerance: 50

  - name: "🌐 其他地区"
    type: url-test
    include-all-proxies: true
    exclude-type: direct
    exclude-filter: '(?i)(港|HK|Hong Kong|HongKong|深港|🇭🇰|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|🇺🇸|United States|UnitedStates|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan|🇯🇵|(?:^|[^尼-])日|新加坡|坡|狮城|SG|🇸🇬|Singapore|台|台湾|新北|彰化|TW|Taiwan|🇹🇼)'
    url: "https://www.gstatic.com/generate_204"
    interval: 600
    timeout: 5000
    tolerance: 50

  - name: "🎯 全球直连"
