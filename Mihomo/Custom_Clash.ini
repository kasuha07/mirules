; ============================================================
; Custom OpenClash Rules
; 全分组防 DNS 泄漏订阅转换模板
; ============================================================
; 作者：https://github.com/Aethersailor
; 项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules

[custom]

; ============================================================
; 规则集
; ============================================================
; 规则自上而下依次匹配，优先命中靠前的规则。
; 重复规则无影响，但修改规则顺序会影响实际分流效果。

; ------------------------------------------------------------
; 本地地址、自定义规则与基础直连
; ------------------------------------------------------------
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/kasuha07/mirules@main/Mihomo/Provider/Custom_Direct_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Proxy_Classical.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn

; Steam 下载 CDN 直连
ruleset=🎯 全球直连,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Steam_CDN_Classical.yaml,2880

; 各大游戏平台下载域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download

; BT Tracker 相关域名直连
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; ------------------------------------------------------------
; 应用与服务分流
; ------------------------------------------------------------
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=📦 大流量下载,clash-domain:https://testingcf.jsdelivr.net/gh/kasuha07/mirules@main/Mihomo/Provider/Custom_Large_Download_Domain.yaml,28800
ruleset=🤖 AI服务,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,bing
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn
ruleset=🎮 Steam,[]GEOSITE,steam
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=📺 Bahamut,[]GEOSITE,bahamut
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=📢 谷歌服务,[]GEOSITE,googlefcm
ruleset=📢 谷歌服务,[]GEOSITE,google
ruleset=🚀 手动选择,[]GEOSITE,gfw
ruleset=🎮 游戏平台,[]GEOSITE,category-games

; ------------------------------------------------------------
; IP 分流
; ------------------------------------------------------------
ruleset=📢 谷歌服务,[]GEOIP,google,no-resolve
ruleset=🌐 社交媒体,[]GEOIP,twitter,no-resolve

; ------------------------------------------------------------
; 国内流量兜底
; ------------------------------------------------------------
; 由于 OpenClash 使用的大陆白名单收录不全，此处保留 geosite:cn 作为国内域名兜底。
ruleset=🎯 全球直连,[]GEOSITE,cn

; 由于 OpenClash 使用的大陆白名单收录不全，此处保留 geoip:cn 作为国内 IP 兜底。
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

; 以上兜底规则会根据实际情况随时取消。

; ------------------------------------------------------------
; 非标端口与最终兜底
; ------------------------------------------------------------
; PT/BT 优化开启会使 80/443 以外端口的流量直连。
ruleset=🔀 非标端口,clash-classic:https://api.asailor.org/Custom_OpenClash_Rules/main/rule/Custom_Port_Direct.yaml,28800

; 国内冷门域名会命中漏网之鱼，如影响使用，请设置漏网之鱼直连。
; 漏网之鱼直连时，无法通过 DNS 泄露测试，但是并不存在泄露。
ruleset=🐟 漏网之鱼,[]FINAL

; ============================================================
; 节点分组
; ============================================================

; ------------------------------------------------------------
; 核心选择
; ------------------------------------------------------------
custom_proxy_group=🚀 手动选择`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`[]♻️ 自动选择`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,,50

; ------------------------------------------------------------
; 应用与服务
; ------------------------------------------------------------
custom_proxy_group=📦 大流量下载`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=🤖 AI服务`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=🌐 社交媒体`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`[]🚀 手动选择`[]♻️ 自动选择`.*
custom_proxy_group=📢 谷歌服务`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=📹 YouTube`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=📺 Bahamut`select`[]🇼🇸 台湾节点`[]🚀 手动选择`[]🎯 全球直连
custom_proxy_group=🎮 游戏平台`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=🎮 Steam`select`[]🎯 全球直连`[]🚀 手动选择`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*

; ------------------------------------------------------------
; 兜底与特殊流量
; ------------------------------------------------------------
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 手动选择`[]♻️ 自动选择`[]🎯 全球直连`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇼🇸 台湾节点`[]🌐 其他地区`.*
custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]🎯 全球直连

; ------------------------------------------------------------
; 地区节点测速
; ------------------------------------------------------------
custom_proxy_group=🇭🇰 香港节点`url-test`(港|HK|hk|Hong Kong|HongKong|hongkong|深港|🇭🇰)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇺🇸 美国节点`url-test`(美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|🇺🇸|United States|UnitedStates)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇯🇵 日本节点`url-test`(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇸🇬 新加坡节点`url-test`(新加坡|坡|狮城|SG|🇸🇬|Singapore)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🇼🇸 台湾节点`url-test`(台|台湾|新北|彰化|TW|Taiwan|🇼🇸)`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🌐 其他地区`url-test`(^(?!.*(港|HK|hk|Hong Kong|HongKong|hongkong|深港|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|UnitedStates|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|(?<!尼|-)日|JP|Japan|🇯🇵|新加坡|坡|狮城|SG|Singapore|台|新北|彰化|TW|Taiwan)).*)`https://www.gstatic.com/generate_204`300,,50

; ------------------------------------------------------------
; 基础动作
; ------------------------------------------------------------
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼

; ============================================================
; 生成参数（请勿修改）
; ============================================================
enable_rule_generator=true
overwrite_original_rules=true
